<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080e24">
<title>PLANET MERGE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<header><div class="eyebrow">COSMIC PUZZLE / VERSION 0.2</div><h1>PLANET <span>MERGE</span></h1><p>小さな惑星から、宇宙をつなごう。</p></header>
<section class="game-shell" aria-label="惑星パズルゲーム">
<div class="game-bar"><span><i></i> ORBIT LAB</span><button id="reset" type="button">はじめから</button></div>
<div class="play-area">
<canvas id="game" width="420" height="640" aria-label="マウスまたは指で方向を合わせ、クリックまたは指を離して惑星を発射します"></canvas>
<div id="game-over" class="game-over" hidden><div class="over-card"><p>MISSION ENDED</p><h2>GAME OVER</h2><p>惑星が危険ラインに到達しました</p><button id="retry" type="button">もう一度遊ぶ</button></div></div>
</div>
<div class="game-footer"><span>NOW <b id="current">水星</b></span><span>NEXT <b id="next">金星</b></span></div>
</section>
<p id="status" role="status">方向を合わせて、クリックで発射</p>
<section class="guide"><p class="available-label">発射できる惑星</p><p id="available" aria-live="polite"></p><h2>惑星の進化</h2><div id="evolution"></div><p>同じ惑星は上側で進化。同じ高さなら左側を優先します。<br>新しい惑星を作ると、発射候補に追加されます。<br>冥王星どうしは、合体すると消えます。</p></section>
<p class="help">Mac：マウスで照準 → クリック　／　iPhone：指で照準 → 離して発射</p>
</main>
<script src="game.js"></script>
</body>
</html>
